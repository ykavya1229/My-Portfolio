<!DOCTYPE html>
<html>
<head>
    <title>Form Elements</title>
</head>
<body>
    <h1>Contact Me</h1>
    <p>feel free to call</p>
    <from action="">
        <label for="name">Name:</label>
        <input  type="text">
        <br>
        <br>
        <label for="email">Email</label>
        <input type="text">
        <br>
        <br>
        <b>choose the gender:</b>
        <input type="radio">
        <label for="male">Male</label>
        <input type="radio">
        <label for="female">Female</label>
        <br>
        <br>
        <b>choose your intrest:</b>
        <input type="checkbox">
        <label for="codeing">Codeing</label>
        <input type="checkbox">
        <label for="reading">Reading</label>
        <br>
        <br>
        <label for="Bio">Bio (up to 400 characters)</label>
        <input type="text"
        <br>
        <br>
        <button type="submit"> Submit</button>

    </from>
</body>
</html>
