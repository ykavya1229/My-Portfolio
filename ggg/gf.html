<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Extra Big Heart Gift Box</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at center, #ffe6f0, #ccf5ff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .heart-container {
      position: relative;
      width: 500px;
      height: 450px;
      cursor: pointer;
    }

    .heart-back {
      background-color: #ff4d6d;
      position: absolute;
      width: 500px;
      height: 450px;
      top: 0;
      left: 0;
      clip-path: polygon(
        50% 80%,
        90% 40%,
        75% 15%,
        50% 30%,
        25% 15%,
        10% 40%
      );
      z-index: 1;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .heart-lid {
      background-color: #cc0033;
      position: absolute;
      width: 500px;
      height: 450px;
      top: 0;
      left: 0;
      clip-path: polygon(
        50% 80%,
        90% 40%,
        75% 15%,
        50% 30%,
        25% 15%,
        10% 40%
      );
      transform-origin: bottom center;
      transition: transform 1s ease;
      z-index: 2;
      box-shadow: inset 0 0 20px #a10028;
    }

    .heart-container.open .heart-lid {
      transform: rotateX(130deg);
    }

    .message {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      color: #2b0963;
      font-size: 1.1rem; /* Medium font size */
      text-align: center;
      opacity: 0;
      transition: opacity 1s, transform 1s;
      z-index: 3;
      width: 350px;
      font-weight: 600;
      line-height: 1.3;
      user-select: none;
      background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fad0c4, #ff9a9e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .heart-container.open .message {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Floating decorations */
    .decor {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }

    .decor span {
      position: absolute;
      display: block;
      background-size: cover;
      opacity: 0.8;
      animation: float 15s linear infinite;
      filter: drop-shadow(0 0 1px #d40a50);
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Floating hearts and flowers -->
  <div class="decor" id="decor"></div>

  <!-- Heart Gift Box -->
  <div class="heart-container" onclick="openHeart()">
    <div class="heart-lid"></div>
    <div class="heart-back"></div>
    <div class="message">
      💖 Nee kosam special gift...<br>
      Nuvvu na hrudayam ❤️🌸
    </div>
  </div>

  <script>
    function openHeart() {
      document.querySelector('.heart-container').classList.add('open');
    }

    // Floating decoration images
    const decor = document.getElementById('decor');
    const images = [
      'https://i.imgur.com/FvS9Zto.png', // heart
      'https://i.imgur.com/k5Ew0lQ.png', // flower
    ];

    for (let i = 0; i < 35; i++) {
      const span = document.createElement('span');
      const img = images[Math.floor(Math.random() * images.length)];
      const size = Math.random() * 30 + 20;
      span.style.width = size + 'px';
      span.style.height = size + 'px';
      span.style.left = Math.random() * 100 + 'vw';
      span.style.top = Math.random() * 100 + 'vh';
      span.style.backgroundImage = `url(${img})`;
      span.style.animationDuration = (10 + Math.random() * 10) + 's';
      decor.appendChild(span);
    }
  </script>

</body>
</html>
